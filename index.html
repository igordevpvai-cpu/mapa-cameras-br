<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#102b3f">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("mapa-tema"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<title>Câmeras ao vivo — Brasil</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
:root {
  --navy: #102b3f;
  --teal: #176b87;
  --teal-d: #0f526a;
  --red: #e44d43;
  --ink: #18364a;
  --muted: #5b7384;
  --glass: rgba(255, 255, 255, .72);
  --glass-strong: rgba(255, 255, 255, .88);
  --line: rgba(16, 43, 63, .10);
  --fill: rgba(16, 43, 63, .06);
  --fill-h: rgba(16, 43, 63, .11);
  --shadow: 0 1px 0 rgba(255, 255, 255, .75) inset, 0 12px 40px rgba(16, 43, 63, .18), 0 2px 8px rgba(16, 43, 63, .08);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --peek: 150px;
  --title: #102b3f;
  --chip-on: #102b3f;
  --tip-bg: #102b3f;
  --uf-bg: rgba(23, 107, 135, .13);
  --uf-fg: #0f526a;
  --sel: rgba(23, 107, 135, .14);
  --handle: rgba(16, 43, 63, .25);
  --danger: #c0362d;
  --edge: rgba(255, 255, 255, .6);
  --attr-bg: rgba(255, 255, 255, .65);
  --toast-bg: rgba(16, 43, 63, .9);
  --map-bg: #dce8ed;
  --state-line: rgba(16, 43, 63, .30);
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e6eef3;
  --muted: #9db1bf;
  --title: #f2f7fa;
  --teal: #1f7f9e;
  --teal-d: #2a93b5;
  --glass: rgba(22, 36, 48, .72);
  --glass-strong: rgba(22, 36, 48, .9);
  --line: rgba(255, 255, 255, .12);
  --fill: rgba(255, 255, 255, .08);
  --fill-h: rgba(255, 255, 255, .14);
  --shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 12px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  --chip-on: #2a8fb0;
  --tip-bg: #0b1722;
  --uf-bg: rgba(90, 190, 220, .18);
  --uf-fg: #9fd8ea;
  --sel: rgba(90, 190, 220, .22);
  --handle: rgba(255, 255, 255, .3);
  --danger: #ff8f86;
  --edge: rgba(255, 255, 255, .14);
  --attr-bg: rgba(22, 36, 48, .7);
  --toast-bg: rgba(48, 66, 82, .92);
  --map-bg: #0e1a24;
  --state-line: rgba(255, 255, 255, .20);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { background: var(--map-bg); overflow: hidden; }

button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

#map { position: fixed; inset: 0; background: var(--map-bg); }

/* divisas entre estados: mais sutis que a fronteira de país do mapa-base */
.state-border { stroke: var(--state-line); stroke-width: .8px; fill: none; pointer-events: none; }

/* ---------- Painel (material translúcido) ---------- */

.panel {
  position: fixed;
  z-index: 500;
  display: flex;
  flex-direction: column;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--edge);
  box-shadow: var(--shadow);
}

@media (min-width: 701px) {
  .panel { left: 12px; top: 12px; bottom: 12px; width: 348px; border-radius: 22px; }
}

@media (max-width: 700px) {
  .panel {
    left: 0; right: 0; bottom: 0;
    height: 88vh; height: 88dvh;
    border-radius: 22px 22px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .leaflet-bottom { bottom: var(--peek); transition: bottom .3s var(--ease); }
}

.grab { padding: 16px 16px 4px; }

.handle { display: none; }

@media (max-width: 700px) {
  .grab { padding-top: 0; touch-action: none; cursor: grab; }
  .handle { display: flex; justify-content: center; align-items: center; height: 22px; }
  .handle::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--handle); }
}

.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

h1 {
  margin: 0;
  font-size: 22px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.022em;
  color: var(--title);
}

.count { margin-top: 3px; font-size: 13px; letter-spacing: .005em; color: var(--muted); }

@media (max-width: 700px) { #collapse svg { transform: rotate(-90deg); } }

.tools { display: flex; gap: 8px; padding: 10px 14px 8px; }

.search-wrap { position: relative; flex: 1; min-width: 0; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.search {
  width: 100%; height: 40px; padding: 0 12px 0 35px;
  border: 0; border-radius: 12px; background: var(--fill);
  font: 400 16px var(--font); color: var(--ink);
  transition: box-shadow .12s;
}
.search:focus { outline: none; box-shadow: 0 0 0 2px var(--teal); }
.search::placeholder { color: var(--muted); }

.add-btn {
  flex: none; height: 40px; padding: 0 14px 0 11px;
  display: flex; align-items: center; gap: 6px;
  border: 0; border-radius: 12px; background: var(--teal); color: #fff;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .15s, transform .1s ease-out;
}
.add-btn:hover { background: var(--teal-d); }
.add-btn:active { transform: scale(.96); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 10px; }

@media (max-width: 700px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
}

.chip {
  flex: none; height: 30px; padding: 0 11px;
  border: 0; border-radius: 999px; background: var(--fill); color: var(--ink);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s, transform .1s ease-out;
}
.chip small { margin-left: 5px; font-size: 12px; font-weight: 500; color: var(--muted); transition: color .15s; }
.chip:hover { background: var(--fill-h); }
.chip:active { transform: scale(.96); }
.chip.active { background: var(--chip-on); color: #fff; }
.chip.active small { color: rgba(255, 255, 255, .7); }

/* ---------- Lista ---------- */

.list-wrap {
  flex: 1; min-height: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 18px), transparent 100%);
}

.list { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 8px 8px 20px; }

.row { display: flex; align-items: center; border-radius: 12px; transition: background .12s; }
.row:hover { background: var(--fill); }
.row.selected { background: var(--sel); }

.item {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: 9px 8px; border: 0; border-radius: 12px; background: none;
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  transition: transform .1s ease-out;
}
.item:active { transform: scale(.985); }

.uf {
  flex: none; width: 36px; padding: 4px 0; border-radius: 8px; text-align: center;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  background: var(--uf-bg); color: var(--uf-fg);
}

.name { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.row-acts { display: flex; padding-right: 4px; }

@media (hover: hover) {
  .row-acts { opacity: 0; transition: opacity .12s; }
  .row:hover .row-acts, .row:focus-within .row-acts, .row.selected .row-acts { opacity: 1; }
}

.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer;
  transition: background .12s, color .12s, transform .1s ease-out;
}
.icon-btn:hover { background: var(--fill-h); color: var(--ink); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.del:hover { background: rgba(228, 77, 67, .15); color: var(--danger); }

.empty { padding: 28px 16px; text-align: center; font-size: 14px; color: var(--muted); }
.empty p { margin: 0 0 12px; }

.btn {
  height: 40px; padding: 0 16px; border: 0; border-radius: 12px;
  background: var(--fill); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .15s, transform .1s ease-out;
}
.btn:hover { background: var(--fill-h); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-d); }
.btn:disabled { opacity: .6; cursor: default; }


/* ---------- Relógio e tema ---------- */

.hud {
  position: fixed; z-index: 500; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%;
  transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
  padding: 5px 5px 5px 18px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
}
@media (min-width: 701px) {
  .hud { left: calc(360px + (100vw - 360px) / 2); transition: left .4s var(--ease); }
  body.collapsed .hud { left: 50%; }
}
.clock { display: flex; flex-direction: column; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock-time { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: var(--title); }
.clock-date { font-size: 11.5px; letter-spacing: .01em; color: var(--muted); }
.theme-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--fill); }

/* ---------- Rodapé: exportar / restaurar ---------- */

.footer { display: flex; gap: 8px; padding: 6px 14px 14px; }
.footer .btn { flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; }

/* ---------- Botão flutuante (painel recolhido) ---------- */

.fab {
  position: fixed; z-index: 500; left: 12px; top: 12px; width: 48px; height: 48px;
  display: grid; place-items: center; border: 1px solid var(--edge); border-radius: 16px;
  background: var(--glass); color: var(--title); cursor: pointer; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  opacity: 0; transform: scale(.9); pointer-events: none;
  transition: opacity .2s, transform .25s var(--ease);
}
body.collapsed .fab { opacity: 1; transform: none; pointer-events: auto; }
body.collapsed .fab:active { transform: scale(.94); }
@media (max-width: 700px) { .fab { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- Controles do Leaflet ---------- */

.leaflet-control-attribution a { color: var(--teal) !important; }

.leaflet-control-zoom {
  border: 0 !important; border-radius: 14px; overflow: hidden;
  background: var(--glass); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
}
.leaflet-control-zoom a {
  width: 40px !important; height: 40px !important; line-height: 40px !important;
  background: transparent !important; color: var(--ink) !important; border: 0 !important; font-size: 20px;
  transition: background .12s;
}
.leaflet-control-zoom a:hover { background: var(--fill-h) !important; }
.leaflet-control-zoom a + a { border-top: 1px solid var(--line) !important; }

.leaflet-control-attribution {
  background: var(--attr-bg) !important; color: var(--muted) !important; font-size: 10px !important;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}

/* ---------- Marcadores ---------- */

.camera-pin {
  width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: linear-gradient(135deg, #f0645a, #d9403a); border: 3px solid #fff;
  box-shadow: 0 3px 10px rgba(16, 43, 63, .35);
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s var(--ease), box-shadow .14s;
}
.camera-pin span { transform: rotate(45deg); color: #fff; font-size: 13px; margin-left: 1px; }

.pin-wrap:hover .camera-pin, .pin-wrap.hl .camera-pin, .pin-wrap.sel .camera-pin { transform: rotate(-45deg) scale(1.14); }
.pin-wrap:active .camera-pin { transform: rotate(-45deg) scale(.95); }
.pin-wrap.sel .camera-pin, .pin-wrap.hl .camera-pin { box-shadow: 0 0 0 5px rgba(228, 77, 67, .28), 0 3px 10px rgba(16, 43, 63, .35); }

.cluster { background: rgba(228, 77, 67, .18); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.cluster div {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #f0645a, #d9403a); border: 3px solid #fff; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; box-shadow: 0 3px 10px rgba(16, 43, 63, .35);
  transition: transform .14s var(--ease);
}
.cluster:hover div { transform: scale(1.1); }
.cluster:active div { transform: scale(.95); }

.leaflet-tooltip.glass-tip {
  background: var(--tip-bg); color: #fff; border: 0; border-radius: 8px; padding: 4px 9px;
  font: 600 12px var(--font); letter-spacing: .01em; box-shadow: 0 4px 14px rgba(16, 43, 63, .3);
}
.leaflet-tooltip-top.glass-tip::before { border-top-color: var(--tip-bg); }

/* ---------- Balão do marcador ---------- */

.glass-popup .leaflet-popup-content-wrapper {
  padding: 0; border-radius: 18px; border: 1px solid var(--edge);
  background: var(--glass-strong); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  transform-origin: 50% 100%; animation: popIn .22s var(--ease);
}
.glass-popup .leaflet-popup-content { margin: 14px; min-width: 210px; font-family: var(--font); }
.glass-popup .leaflet-popup-tip { background: var(--glass-strong); box-shadow: none; }

@keyframes popIn { from { opacity: 0; transform: scale(.92); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }

.pop-title { font-size: 18px; font-weight: 700; letter-spacing: -.015em; color: var(--title); }
.pop-sub { margin: 2px 0 4px; font-size: 13px; color: var(--muted); }
.pop-time { margin: 0 0 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.pop-open {
  display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px;
  border-radius: 12px; background: var(--teal); color: #fff !important; text-decoration: none;
  font-size: 14px; font-weight: 600; transition: background .15s, transform .1s ease-out;
}
.pop-open:hover { background: var(--teal-d); }
.pop-open:active { transform: scale(.97); }

.pop-acts { display: flex; gap: 6px; margin-top: 6px; }
.pop-act {
  flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: 10px; background: var(--fill); color: var(--ink);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: background .12s, transform .1s ease-out;
}
.pop-act:hover { background: var(--fill-h); }
.pop-act:active { transform: scale(.97); }
.pop-act.del { color: var(--danger); }
.pop-act.del:hover { background: rgba(228, 77, 67, .15); }

/* ---------- Aviso (toast) e modo "escolher no mapa" ---------- */

.toast {
  position: fixed; z-index: 2000; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 24px);
  padding: 10px 10px 10px 18px; border-radius: 999px;
  background: var(--toast-bg); color: #fff; font-size: 14px;
  -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  box-shadow: 0 8px 28px rgba(16, 43, 63, .35);
  opacity: 0; transform: translate(-50%, -16px);
  transition: transform .3s var(--ease), opacity .2s;
}
.toast.in { opacity: 1; transform: translate(-50%, 0); }
.toast button {
  flex: none; padding: 8px 13px; border: 0; border-radius: 999px;
  background: rgba(255, 255, 255, .18); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .12s, transform .1s ease-out;
}
.toast button:hover { background: rgba(255, 255, 255, .28); }
.toast button:active { transform: scale(.95); }

.pick-banner {
  position: fixed; z-index: 2000; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%); display: none; align-items: center; gap: 12px;
  padding: 8px 8px 8px 16px; border-radius: 999px; font-size: 14px; color: #fff;
  background: var(--toast-bg); box-shadow: 0 8px 28px rgba(16, 43, 63, .35);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.pick-banner.on { display: flex; }
.pick-banner .btn { height: 34px; padding: 0 12px; background: rgba(255, 255, 255, .18); color: #fff; }
body.picking #map { cursor: crosshair; }

/* ---------- Formulário ---------- */

dialog {
  width: min(440px, calc(100vw - 24px)); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px);
  padding: 0; border: 0; border-radius: 22px; color: var(--ink); font-family: var(--font);
  background: var(--glass-strong); box-shadow: var(--shadow); overflow: auto;
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
}
dialog[open] { animation: dlgIn .3s var(--ease); }
dialog.closing { animation: dlgOut .16s ease-in forwards; }
dialog::backdrop {
  background: rgba(16, 43, 63, .32);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  animation: fade .25s ease;
}
dialog.closing::backdrop { animation: fadeOut .16s ease forwards; }

@keyframes dlgIn { from { opacity: 0; transform: scale(.94); } }
@keyframes dlgOut { to { opacity: 0; transform: scale(.96); } }

.form { display: flex; flex-direction: column; gap: 14px; padding: 22px; }
.form h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: var(--title); }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.field input, .field select {
  height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--fill);
  font: 400 16px var(--font); color: var(--ink); transition: box-shadow .12s;
}
.field input:focus, .field select:focus { outline: none; box-shadow: 0 0 0 2px var(--teal); }
.field [aria-invalid="true"] { box-shadow: 0 0 0 2px var(--red); }

.cols { display: grid; grid-template-columns: 96px 1fr; gap: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tool-row .btn { height: 36px; font-size: 13px; }
.msg { min-height: 18px; margin: -4px 0; font-size: 13px; color: var(--danger); }
.actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- Acessibilidade ---------- */

@media (prefers-reduced-motion: reduce) {
  .glass-popup .leaflet-popup-content-wrapper, dialog[open] { animation: fade .2s; }
  dialog.closing { animation: fadeOut .12s forwards; }
  .toast, .toast.in { transform: translate(-50%, 0); }
  .fab, body.collapsed .fab { transform: none; }
}

@media (prefers-reduced-transparency: reduce) {
  :root { --glass: #fff; --glass-strong: #fff; }
  :root[data-theme="dark"] { --glass: #17232d; --glass-strong: #17232d; }
  .panel, .fab, .hud, dialog, dialog::backdrop, .leaflet-control-zoom, .glass-popup .leaflet-popup-content-wrapper,
  .toast, .pick-banner, .leaflet-control-attribution { -webkit-backdrop-filter: none; backdrop-filter: none; }
}

@media (prefers-contrast: more) {
  :root { --glass: #fff; --glass-strong: #fff; --line: var(--ink); --fill: rgba(16, 43, 63, .12); }
  :root[data-theme="dark"] { --glass: #17232d; --glass-strong: #17232d; --fill: rgba(255, 255, 255, .16); }
  .panel, .fab, .hud, dialog, .glass-popup .leaflet-popup-content-wrapper { border: 1px solid var(--ink); }
  .count { color: var(--ink); }
}
</style>
</head>

<body>

<aside class="panel" id="sidebar" aria-label="Lista de câmeras">
  <div class="grab" id="grab">
    <div class="handle" id="handle" role="button" tabindex="0" aria-label="Expandir ou recolher a lista"></div>
    <div class="panel-head">
      <div>
        <h1>Câmeras ao vivo</h1>
        <div class="count" id="count" aria-live="polite"></div>
      </div>
      <button class="icon-btn collapse" id="collapse" type="button" data-nodrag title="Recolher lista" aria-label="Recolher lista">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
  </div>

const STORAGE_KEY = "mapa-cameras-v1";

const SEEN_KEY = "mapa-cameras-defaults-seen";
const LEGACY_DEFAULTS = 15; // quantidade de câmeras da lista original

function loadCameras() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        // Acrescenta câmeras novas da lista padrão sem recriar as que o usuário excluiu
        let seen = null;
        try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)); } catch (e) {}
        if (!Array.isArray(seen)) seen = DEFAULT_CAMERAS.slice(0, LEGACY_DEFAULTS).map(d => d.url);
        const have = new Set(arr.map(c => c.url));
        DEFAULT_CAMERAS.forEach(d => {
          if (!seen.includes(d.url) && !have.has(d.url)) arr.push(JSON.parse(JSON.stringify(d)));
        });
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
          localStorage.setItem(SEEN_KEY, JSON.stringify(DEFAULT_CAMERAS.map(d => d.url)));
        } catch (e) {}
        return arr;
      }
    }
  } catch (e) { /* sem armazenamento: usa o padrão */ }
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(DEFAULT_CAMERAS.map(d => d.url))); } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CAMERAS));
}

function saveCameras() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cameras)); }
  catch (e) { console.warn("Não foi possível salvar no navegador."); }
}

// ==========================================
// MOLA (spring) — interrompível, parte do valor atual
// ==========================================

const spring = { x: 0, v: 0, raf: 0, active: false };

function rubberband(over, dim, c) {
  c = c || 0.55;
  return (over * dim * c) / (dim + c * Math.abs(over));
}

function project(v, rate) {
  rate = rate || 0.998;
  return (v / 1000) * rate / (1 - rate);
}

function setPos(x) {
  if (!isFinite(x)) x = targetPos();
  panel.style.transform = isMobile()
    ? "translate3d(0," + x + "px,0)"
    : "translate3d(" + x + "px,0,0)";
}

function springTo(target, opts) {
  opts = opts || {};
  cancelAnimationFrame(spring.raf);
  if (!isFinite(target)) target = targetPos();
  if (typeof opts.velocity === "number") spring.v = opts.velocity;
  if (!isFinite(spring.x)) spring.x = target;
  if (!isFinite(spring.v)) spring.v = 0;

  if (mqReduce.matches) {
    spring.active = false;
    spring.x = target; spring.v = 0; setPos(target);
    return;
  }
  spring.active = true;

  const response = opts.response || 0.4;
  const damping = opts.damping == null ? 1 : opts.damping;
  const w = 2 * Math.PI / response;
  const k = w * w;
  const c = 2 * damping * w;
  let last = performance.now();

  const step = (now) => {
    const dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    const n = Math.max(1, Math.ceil(dt * 240));
    const h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = -k * (spring.x - target) - c * spring.v;
      spring.v += a * h;
      spring.x += spring.v * h;
    }
    setPos(spring.x);
    if (Math.abs(spring.x - target) < 0.4 && Math.abs(spring.v) < 8) {
      spring.x = target; spring.v = 0; setPos(target);
      spring.active = false;
      return;
    }
    spring.raf = requestAnimationFrame(step);
  };
  spring.raf = requestAnimationFrame(step);
}


// ==========================================
// PAINEL: gaveta no celular, recolhível no desktop
// ==========================================

let snap = "peek";        // celular: peek | half | full
let panelOpen = true;     // desktop

function metrics() {
  const padB = parseFloat(getComputedStyle(panel).paddingBottom) || 0;
  return { H: panel.offsetHeight, peekVis: grab.offsetHeight + tools.offsetHeight + 10 + padB };
}

function snapPositions() {
  const m = metrics();
  return {
    full: 0,
    half: Math.max(0, m.H - innerHeight * 0.5),
    peek: Math.max(0, m.H - m.peekVis),
    hidden: m.H + 24
  };
}

const closedX = () => -(panel.offsetWidth + 24);
const targetPos = () => isMobile() ? snapPositions()[snap] : (panelOpen ? 0 : closedX());

function syncCollapsed() {
  const collapsed = isMobile() ? snap === "hidden" : !panelOpen;
  document.body.classList.toggle("collapsed", collapsed);
  panel.inert = collapsed;
  $("fab").inert = !collapsed;
  document.documentElement.style.setProperty("--peek", (isMobile() && snap === "hidden" ? 0 : metrics().peekVis) + "px");
}

function applyLayoutNow() {
  cancelAnimationFrame(spring.raf);
  spring.active = false;
  spring.x = targetPos(); spring.v = 0;
  setPos(spring.x);
  syncCollapsed();
}

function goSnap(name, opts) {
  snap = name;
  syncCollapsed();
  springTo(snapPositions()[name], Object.assign({ response: 0.35, damping: 1 }, opts || {}));
}

function setPanelOpen(open) {
  panelOpen = open;
  syncCollapsed();
  springTo(open ? 0 : closedX(), { response: 0.42, damping: 1 });
  if (!open) $("fab").focus({ preventScroll: true });
}

// Reage já ao soltar o dedo (pointerup); "click" continua valendo para mouse e teclado.
function onTap(el, fn) {
  let last = 0;
  const run = () => {
    const n = performance.now();
    if (n - last < 400) return;
    last = n;
    fn();
  };
  el.addEventListener("pointerup", (e) => {
    if (e.pointerType === "mouse") return;
    const r = el.getBoundingClientRect();
    const m = 10;
    if (e.clientX < r.left - m || e.clientX > r.right + m || e.clientY < r.top - m || e.clientY > r.bottom + m) return;
    run();
  });
  el.addEventListener("click", run);
}

onTap($("collapse"), () => {
  if (isMobile()) {
    if (document.activeElement === searchEl) searchEl.blur();
    goSnap("hidden", { velocity: 0 });
    $("fab").focus({ preventScroll: true });
  } else {
    setPanelOpen(false);
  }
});
onTap($("fab"), () => {
  if (isMobile()) goSnap("peek", { velocity: 0 });
  else setPanelOpen(true);
});

// --- arraste da gaveta (Pointer Events, 1:1, velocidade e projeção) ---

let drag = null;

// Toque: alterna entre recolhida e meio. Aberta/meio -> recolhe.
let lastToggle = 0;
function toggleSheet() {
  const now = performance.now();
  if (now - lastToggle < 450) return;            // ignora toque duplicado / eco
  lastToggle = now;
  if (snap === "hidden") {
    goSnap("peek", { velocity: 0 });
  } else if (snap === "peek") {
    goSnap("half", { velocity: 0 });
  } else {
    if (document.activeElement === searchEl) searchEl.blur();   // fecha o teclado
    goSnap("peek", { velocity: 0 });
  }
}

grab.addEventListener("pointerdown", (e) => {
  if (!isMobile() || e.target.closest("[data-nodrag]")) return;
  cancelAnimationFrame(spring.raf);              // pode agarrar no meio da animação
  spring.active = false;
  try { grab.setPointerCapture(e.pointerId); } catch (err) {}
  drag = {
    id: e.pointerId, startY: e.clientY, origY: e.clientY, t0: e.timeStamp,
    startX: spring.x, moved: false, hist: [{ t: e.timeStamp, y: e.clientY }]
  };
});

grab.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.startY;
  if (!drag.moved) {
    if (Math.abs(dy) < 10) return;               // histerese: tremor do dedo não conta
    drag.moved = true;
    drag.startY = e.clientY;
    drag.hist = [];
  }
  drag.hist.push({ t: e.timeStamp, y: e.clientY });
  if (drag.hist.length > 8) drag.hist.shift();

  const S = snapPositions();
  let pos = drag.startX + (e.clientY - drag.startY);
  if (pos < S.full) pos = S.full - rubberband(S.full - pos, 140);
  else if (pos > S.hidden) pos = S.hidden + rubberband(pos - S.hidden, 140);
  spring.x = pos; spring.v = 0;
  setPos(pos);
});

function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;

  if (e.type === "pointercancel") { goSnap(snap); return; }

  // Toque (mesmo com pequeno tremor): curto e quase sem deslocamento
  const travel = Math.abs(e.clientY - d.origY);
  const quick = (e.timeStamp - d.t0) < 400;
  if (!d.moved || (travel < 16 && quick)) { toggleSheet(); return; }

  // Velocidade só dos últimos ~120 ms; ruído pequeno vira zero
  let v = 0;
  if (d.hist.length >= 2) {
    const last = d.hist[d.hist.length - 1];
    let first = d.hist[0];
    for (let i = 0; i < d.hist.length; i++) {
      if (last.t - d.hist[i].t <= 120) { first = d.hist[i]; break; }
    }
    const dt = (last.t - first.t) / 1000;
    if (dt >= 0.016) v = (last.y - first.y) / dt;
  }
  if (Math.abs(v) < 250) v = 0;
  v = Math.max(-3000, Math.min(3000, v));

  const projected = spring.x + project(v);

  const S = snapPositions();
  let best = "peek", bestD = Infinity;
  Object.keys(S).forEach(name => {
    const dist = Math.abs(S[name] - projected);
    if (dist < bestD) { bestD = dist; best = name; }
  });

  goSnap(best, { velocity: v, damping: Math.abs(v) > 300 ? 0.82 : 1 });
}

grab.addEventListener("pointerup", endDrag);
grab.addEventListener("pointercancel", endDrag);

$("handle").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    toggleSheet();
  }
});

window.addEventListener("resize", () => { if (!drag) applyLayoutNow(); });
window.addEventListener("orientationchange", () => { if (!drag) applyLayoutNow(); });
window.addEventListener("pageshow", () => { if (!drag) applyLayoutNow(); });
if (window.visualViewport) {
  visualViewport.addEventListener("resize", () => { if (!drag) applyLayoutNow(); });
}

// Se o toque terminar fora do painel (evento perdido), encerra o arraste
window.addEventListener("pointerup", (e) => { if (drag) endDrag(e); });
window.addEventListener("pointercancel", (e) => { if (drag) endDrag(e); });

// Vigia: se a gaveta, parada, estiver em posição diferente da esperada, volta ao lugar certo
function actualOffset() {
  const m = new DOMMatrixReadOnly(getComputedStyle(panel).transform);
  return isMobile() ? m.m42 : m.m41;
}
setInterval(() => {
  if (drag || spring.active || picking) return;
  try {
    if (Math.abs(actualOffset() - targetPos()) > 40) applyLayoutNow();
  } catch (e) { /* ignora */ }
}, 500);

function padOpts() {
  if (isMobile()) {
    return { paddingTopLeft: [24, 24], paddingBottomRight: [24, metrics().peekVis + 24] };
  }
  return { paddingTopLeft: [panelOpen ? 384 : 24, 24], paddingBottomRight: [72, 24] };
}


// ==========================================
// AVISOS COM "DESFAZER"
// ==========================================

let toastEl = null, toastTimer = 0;

function hideToast(t) {
  t.classList.remove("in");
  setTimeout(() => t.remove(), 300);
  if (toastEl === t) toastEl = null;
}

function showToast(msg, undo) {
  clearTimeout(toastTimer);
  if (toastEl) toastEl.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.setAttribute("role", "status");
  const s = document.createElement("span");
  s.textContent = msg;
  t.appendChild(s);
  if (undo) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Desfazer";
    b.addEventListener("click", () => { undo(); hideToast(t); });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  toastEl = t;
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("in")));
  toastTimer = setTimeout(() => hideToast(t), 6000);
}

// Toda alteração passa por aqui: salva, redesenha e oferece desfazer.
function mutate(msg, fn, fit) {
  const snapshot = JSON.stringify(cameras);
  fn();
  saveCameras();
  refresh(!!fit);
  showToast(msg, () => {
    cameras = JSON.parse(snapshot);
    saveCameras();
    refresh(false);
  });
}

// MARCADORES, LISTA E FILTROS

const UF_TZ = {
  AC: "America/Rio_Branco", AM: "America/Manaus", RO: "America/Porto_Velho",
  RR: "America/Boa_Vista", MT: "America/Cuiaba", MS: "America/Campo_Grande"
};

function localTime(uf) {
  try {
    return new Intl.DateTimeFormat("pt-BR", {
      hour: "2-digit", minute: "2-digit", timeZone: UF_TZ[uf] || "America/Sao_Paulo"
    }).format(new Date());
  } catch (e) { return ""; }
}

function popupHtml(item, i) {
  return '<div class="pop-title">' + esc(item.city) + '</div>' +
    '<div class="pop-sub">' + esc(UF_NAMES[item.uf] || item.uf) + '</div>' +
    '<div class="pop-time">Horário local ' + localTime(item.uf) + '</div>' +
    '<a class="pop-open" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">Abrir câmeras ao vivo ' + ICON_EXT + '</a>' +
    '<div class="pop-acts">' +
      '<button type="button" class="pop-act" data-act="edit" data-i="' + i + '">' + ICON_EDIT(16) + ' Editar</button>' +
      '<button type="button" class="pop-act del" data-act="del" data-i="' + i + '">' + ICON_TRASH(16) + ' Excluir</button>' +
    '</div>';
}

function setSelected(i) {
  selectedIdx = i;
  listEl.querySelectorAll(".row").forEach(r => {
    const on = Number(r.dataset.i) === i;
    r.classList.toggle("selected", on);
    if (on) r.scrollIntoView({ block: "nearest", behavior: mqReduce.matches ? "auto" : "smooth" });
  });
}

function buildMarkers() {
  const mobile = isMobile();
  const popupOpts = {
    className: "glass-popup",
    closeButton: false,
    offset: [0, 0],
    autoPanPaddingTopLeft: [mobile ? 20 : (panelOpen ? 372 : 20), 70],
    autoPanPaddingBottomRight: [20, mobile ? metrics().peekVis + 20 : 20]
  };

  markers = cameras.map((item, i) => {
    const m = L.marker([item.lat, item.lng], { icon: cameraIcon }).bindPopup(popupHtml(item, i), popupOpts);
    if (canHover) m.bindTooltip(esc(item.city), { direction: "top", offset: [0, -34], className: "glass-tip" });
    m.on("popupopen", (ev) => {
      const pe = ev.popup.getElement();
      const te = pe && pe.querySelector(".pop-time");
      if (te) te.textContent = "Horário local " + localTime(item.uf);
      setSelected(i);
      const el = m.getElement();
      if (el) el.classList.add("sel");
    });
    m.on("popupclose", () => {
      const el = m.getElement();
      if (el) el.classList.remove("sel");
      if (selectedIdx === i) setSelected(-1);
    });
    return m;
  });
}

function renderChips() {
  const counts = {};
  cameras.forEach(c => { counts[c.uf] = (counts[c.uf] || 0) + 1; });
  if (currentUF !== "ALL" && !counts[currentUF]) currentUF = "ALL";
  const all = [["ALL", "Todos", cameras.length]]
    .concat(Object.keys(counts).sort().map(u => [u, u, counts[u]]));
  chipsEl.innerHTML = all.map(([k, label, n]) =>
    '<button type="button" class="chip' + (k === currentUF ? " active" : "") + '" data-uf="' + k + '" aria-pressed="' + (k === currentUF) + '">' +
    label + '<small>' + n + '</small></button>').join("");
}

function visibleIndexes() {
  const q = norm(searchEl.value.trim());
  return cameras.map((c, i) => i)
    .filter(i => (currentUF === "ALL" || cameras[i].uf === currentUF) && norm(cameras[i].city).includes(q))
    .sort((a, b) => cameras[a].city.localeCompare(cameras[b].city, "pt-BR"));
}

function refresh(fit) {
  selectedIdx = -1;
  buildMarkers();
  renderChips();
  const idx = visibleIndexes();

  clusters.clearLayers();
  clusters.addLayers(idx.map(i => markers[i]));

  countEl.textContent = (idx.length === 1 ? "1 câmera" : idx.length + " câmeras") +
    (currentUF !== "ALL" ? " em " + currentUF : "");

  const rows = idx.map(i =>
    '<div class="row" data-i="' + i + '">' +
      '<button type="button" class="item"><span class="uf">' + esc(cameras[i].uf) + '</span><span class="name">' + esc(cameras[i].city) + '</span></button>' +
      '<div class="row-acts">' +
        '<button type="button" class="icon-btn" data-act="edit" title="Editar" aria-label="Editar ' + esc(cameras[i].city) + '">' + ICON_EDIT() + '</button>' +
        '<button type="button" class="icon-btn del" data-act="del" title="Excluir" aria-label="Excluir ' + esc(cameras[i].city) + '">' + ICON_TRASH() + '</button>' +
      '</div>' +
    '</div>').join("");

  listEl.innerHTML = (rows || '<div class="empty"><p>Nenhuma câmera encontrada.</p><button type="button" class="btn" data-act="new">Adicionar câmera</button></div>');

  if (fit && idx.length) {
    map.fitBounds(
      L.latLngBounds(idx.map(i => [cameras[i].lat, cameras[i].lng])),
      Object.assign({ maxZoom: idx.length === 1 ? 11 : 8 }, padOpts())
    );
  }
}

function focusCamera(i) {
  if (isMobile()) goSnap("peek");
  const m = markers[i];
  clusters.zoomToShowLayer(m, () => m.openPopup());
}

function removeCamera(i) {
  const c = cameras[i];
  map.closePopup();
  mutate('"' + c.city + '" excluída', () => { cameras.splice(i, 1); });
}

const centerOf = (el) => {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
};

chipsEl.addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  currentUF = b.dataset.uf;
  refresh(true);
});

searchEl.addEventListener("input", () => refresh(true));
searchEl.addEventListener("focus", () => { if (isMobile() && snap === "peek") goSnap("half"); });
searchEl.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && searchEl.value) { searchEl.value = ""; refresh(true); }
});

listEl.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const row = act.closest(".row");
    const i = row ? Number(row.dataset.i) : -1;
    switch (act.dataset.act) {
      case "edit": return openForm(i, null, centerOf(act));
      case "del": return removeCamera(i);
      case "new": return openForm(null, { city: searchEl.value.trim() }, centerOf(act));
    }
  }
  const b = e.target.closest(".item");
  if (b) focusCamera(Number(b.closest(".row").dataset.i));
});

// Passar o mouse na lista destaca o ponto no mapa
let hoverEl = null;
function clearHover() { if (hoverEl) { hoverEl.classList.remove("hl"); hoverEl = null; } }
listEl.addEventListener("mouseover", (e) => {
  const row = e.target.closest(".row");
  clearHover();
  if (!row) return;
  const m = markers[Number(row.dataset.i)];
  const el = m && m.getElement();
  if (el) { el.classList.add("hl"); hoverEl = el; }
});
listEl.addEventListener("mouseleave", clearHover);

// Botões dentro do balão do marcador
$("map").addEventListener("click", (e) => {
  const b = e.target.closest(".pop-act");
  if (!b) return;
  const i = Number(b.dataset.i);
  const origin = centerOf(b);
  map.closePopup();
  if (b.dataset.act === "edit") openForm(i, null, origin);
  else removeCamera(i);
});

// FORMULÁRIO: ADICIONAR / EDITAR
// ==========================================

const dlg = $("dlg"), fUF = $("fUF"), fCity = $("fCity"), fUrl = $("fUrl"), fLat = $("fLat"), fLng = $("fLng"), fMsg = $("fMsg");
const pickBanner = $("pickBanner");

fUF.innerHTML = ALL_UFS.map(u => "<option>" + u + "</option>").join("");

let editingIndex = null;
let picking = false;

function openDlg(origin) {
  dlg.classList.remove("closing");
  if (!dlg.open) dlg.showModal();
  if (origin) {
    const r = dlg.getBoundingClientRect();
    dlg.style.transformOrigin = (origin.x - r.left) + "px " + (origin.y - r.top) + "px";
  }
}

function closeDlg() {
  if (!dlg.open || dlg.classList.contains("closing")) return;
  dlg.classList.add("closing");
  setTimeout(() => { dlg.classList.remove("closing"); dlg.close(); }, mqReduce.matches ? 120 : 160);
}

function clearInvalid() {
  [fCity, fUrl, fLat, fLng].forEach(el => el.removeAttribute("aria-invalid"));
  fMsg.textContent = "";
}

[fCity, fUrl, fLat, fLng].forEach(el => el.addEventListener("input", () => {
  el.removeAttribute("aria-invalid");
  fMsg.textContent = "";
}));

function openForm(i, prefill, origin) {
  editingIndex = (typeof i === "number" && i >= 0) ? i : null;
  const c = editingIndex === null ? (prefill || null) : cameras[editingIndex];
  $("dlgTitle").textContent = editingIndex === null ? "Adicionar câmera" : "Editar câmera";
  fUF.value = (c && c.uf) || (currentUF !== "ALL" ? currentUF : "PR");
  fCity.value = (c && c.city) || "";
  fUrl.value = (c && c.url) || "";
  fLat.value = (c && c.lat != null) ? c.lat : "";
  fLng.value = (c && c.lng != null) ? c.lng : "";
  clearInvalid();
  if (isMobile()) goSnap("peek");
  openDlg(origin || centerOf($("addBtn")));
  if (editingIndex === null) fCity.focus();
}

$("addBtn").addEventListener("click", (e) => openForm(null, { city: searchEl.value.trim() }, centerOf(e.currentTarget)));
$("fCancel").addEventListener("click", closeDlg);
dlg.addEventListener("cancel", (e) => { e.preventDefault(); closeDlg(); });
dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDlg(); });

$("geoBtn").addEventListener("click", async (e) => {
  const q = fCity.value.trim();
  if (!q) { fCity.setAttribute("aria-invalid", "true"); fMsg.textContent = "Digite o nome da cidade primeiro."; return; }
  const btn = e.currentTarget;
  btn.disabled = true;
  fMsg.style.color = "var(--muted)";
  fMsg.textContent = "Buscando…";
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=" +
      encodeURIComponent(q + ", " + fUF.value + ", Brasil");
    const res = await fetch(url, { headers: { "Accept": "application/json" } });
    const data = await res.json();
    if (!data.length) { fMsg.style.color = ""; fMsg.textContent = "Não encontrei. Use “Escolher no mapa”."; return; }
    fLat.value = Number(data[0].lat).toFixed(4);
    fLng.value = Number(data[0].lon).toFixed(4);
    fMsg.textContent = "";
  } catch (err) {
    fMsg.style.color = "";
    fMsg.textContent = "Falha na busca. Use “Escolher no mapa”.";
  } finally {
    btn.disabled = false;
    setTimeout(() => { fMsg.style.color = ""; }, 0);
  }
});

$("pickBtn").addEventListener("click", () => {
  picking = true;
  document.body.classList.add("picking");
  pickBanner.classList.add("on");
  dlg.close();
});

function stopPicking() {
  picking = false;
  document.body.classList.remove("picking");
  pickBanner.classList.remove("on");
}

map.on("click", (e) => {
  if (!picking) return;
  fLat.value = e.latlng.lat.toFixed(4);
  fLng.value = e.latlng.lng.toFixed(4);
  fLat.removeAttribute("aria-invalid"); fLng.removeAttribute("aria-invalid");
  stopPicking();
  openDlg();
});

$("pickCancel").addEventListener("click", () => { stopPicking(); openDlg(); });


$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  clearInvalid();
  const city = fCity.value.trim();
  let url = fUrl.value.trim();
  const lat = parseFloat(fLat.value.replace(",", "."));
  const lng = parseFloat(fLng.value.replace(",", "."));

  if (!city) { fCity.setAttribute("aria-invalid", "true"); fMsg.textContent = "Informe a cidade ou o nome."; fCity.focus(); return; }
  if (!url) { fUrl.setAttribute("aria-invalid", "true"); fMsg.textContent = "Informe o link da câmera."; fUrl.focus(); return; }
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  if (!isFinite(lat) || lat < -90 || lat > 90) { fLat.setAttribute("aria-invalid", "true"); fMsg.textContent = "Latitude inválida. Use a busca ou escolha no mapa."; return; }
  if (!isFinite(lng) || lng < -180 || lng > 180) { fLng.setAttribute("aria-invalid", "true"); fMsg.textContent = "Longitude inválida. Use a busca ou escolha no mapa."; return; }

  const item = { city, uf: fUF.value, lat, lng, url };
  const wasNew = editingIndex === null;
  let idx;
  mutate(wasNew ? "Câmera adicionada" : "Alterações salvas", () => {
    if (wasNew) { cameras.push(item); idx = cameras.length - 1; }
    else { cameras[editingIndex] = item; idx = editingIndex; }
    currentUF = "ALL";
    searchEl.value = "";
  });
  closeDlg();
  const m = markers[idx];
  clusters.zoomToShowLayer(m, () => m.openPopup());
});

const THEME_KEY = "mapa-tema";
const themeBtn = $("themeBtn");
const ICON_SUN = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 20);
const ICON_MOON = svg('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>', 20);

const currentTheme = () => document.documentElement.dataset.theme === "dark" ? "dark" : "light";

function paintTheme() {
  const dark = currentTheme() === "dark";
  themeBtn.innerHTML = dark ? ICON_SUN : ICON_MOON;
  const label = dark ? "Mudar para o tema claro" : "Mudar para o tema escuro";
  themeBtn.title = label;
  themeBtn.setAttribute("aria-label", label);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0e1a24" : "#102b3f";
}

function setTheme(theme, save) {
  if (theme === currentTheme()) return;
  document.documentElement.dataset.theme = theme;
  if (save) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} }
  paintTheme();

  if (mqReduce.matches) { tiles.setUrl(tileUrl(theme)); return; }

  // troca de mapa com fade, para não haver salto de brilho
  const pane = map.getPane("tilePane");
  pane.style.transition = "opacity .2s";
  pane.style.opacity = "0";
  setTimeout(() => {
    const show = () => { pane.style.opacity = "1"; };
    tiles.once("load", show);
    tiles.setUrl(tileUrl(theme));
    setTimeout(show, 1500);
  }, 200);
}

themeBtn.addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark", true));

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
  if (!saved) setTheme(e.matches ? "dark" : "light", false);
});

paintTheme();


// ==========================================
// EXPORTAR E RESTAURAR (arquivo .json)
// ==========================================

$("exportBtn").addEventListener("click", () => {
  const payload = { app: "mapa-cameras", versao: 1, exportadoEm: new Date().toISOString(), cameras: cameras };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "cameras-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(cameras.length + " câmeras exportadas");
});

$("importBtn").addEventListener("click", () => $("importFile").click());

$("importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const arr = Array.isArray(data) ? data : data.cameras;
    if (!Array.isArray(arr)) throw new Error("formato");

    const num = (v) => (v === null || v === undefined || v === "") ? NaN : Number(v);
    const ok = arr.map(c => ({
      city: String((c && c.city) || "").trim(),
      uf: String((c && c.uf) || "").toUpperCase(),
      lat: num(c && c.lat),
      lng: num(c && c.lng),
      url: String((c && c.url) || "").trim()
    })).filter(c =>
      c.city && /^https?:\/\//i.test(c.url) && ALL_UFS.indexOf(c.uf) !== -1 &&
      isFinite(c.lat) && isFinite(c.lng) && Math.abs(c.lat) <= 90 && Math.abs(c.lng) <= 180);

    if (!ok.length) throw new Error("vazio");

    map.closePopup();
    currentUF = "ALL";
    searchEl.value = "";
    const ignored = arr.length - ok.length;
    mutate(ok.length + " câmeras restauradas" + (ignored ? " (" + ignored + " ignoradas)" : ""), () => { cameras = ok; }, true);
  } catch (err) {
    showToast("Arquivo inválido. Escolha um .json exportado por este mapa.");
  }
});


applyLayoutNow();
map.setView([-15, -52], 4);
refresh(true);

// ==========================================
// LISTA ONLINE (cameras.json no GitHub)
// ==========================================
// Ao abrir, o mapa busca a lista publicada no GitHub. Se ela mudou desde a última
// vez, substitui a lista salva no aparelho. Se não mudou, mantém as edições locais.

const REMOTE_CAMERAS_URL = "https://igordevpvai-cpu.github.io/mapa-cameras-br/cameras.json";
const REMOTE_HASH_KEY = "mapa-cameras-remote-hash";

function cleanCameras(arr) {
  const num = (v) => (v === null || v === undefined || v === "") ? NaN : Number(v);
  return arr.map(c => ({
    city: String((c && c.city) || "").trim(),
    uf: String((c && c.uf) || "").toUpperCase(),
    lat: num(c && c.lat),
    lng: num(c && c.lng),
    url: String((c && c.url) || "").trim()
  })).filter(c =>
    c.city && /^https?:\/\//i.test(c.url) && ALL_UFS.indexOf(c.uf) !== -1 &&
    isFinite(c.lat) && isFinite(c.lng) && Math.abs(c.lat) <= 90 && Math.abs(c.lng) <= 180);
}

function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return String(h);
}

async function syncRemoteCameras() {
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(REMOTE_CAMERAS_URL + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal });
    clearTimeout(to);
    if (!res.ok) return;
    const data = await res.json();
    const arr = Array.isArray(data) ? data : data.cameras;
    if (!Array.isArray(arr)) return;
    const ok = cleanCameras(arr);
    if (!ok.length) return;

    const h = hashStr(JSON.stringify(ok));
    let last = null;
    try { last = localStorage.getItem(REMOTE_HASH_KEY); } catch (e) {}
    if (h === last) return;               // lista online não mudou: mantém o que está no aparelho

    cameras = ok;
    saveCameras();
    try { localStorage.setItem(REMOTE_HASH_KEY, h); } catch (e) {}
    map.closePopup();
    refresh(false);
    showToast("Lista atualizada: " + ok.length + " câmeras");
  } catch (e) { /* sem internet ou arquivo ausente: segue com a lista local */ }
}

syncRemoteCameras();

console.log("Mapa de câmeras inicializado. Total de cidades:", cameras.length);
